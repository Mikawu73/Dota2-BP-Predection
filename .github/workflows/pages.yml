name: Deploy research site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/web/**'
      - 'reports/results.json'
      - 'scripts/build_pages.py'
      - 'tests/test_build_pages.py'
      - 'tests/report_data.test.cjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install "pytest>=8,<10"
      - run: python -m pytest -q tests/test_build_pages.py
      - run: node --check src/web/overview.js
      - run: node --test tests/report_data.test.cjs
      - name: Build public files only
        run: python -m scripts.build_pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
